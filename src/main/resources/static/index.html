<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Pegelstand Monitor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
<h1>Gewässer Monitoring</h1>

<div class="controls">
    <select id="stationSelect"></select>
    <select id="formatSelect">
        <option value="json">JSON</option>
        <option value="xml">XML</option>
    </select>
    <button id="loadBtn">Aktualisieren</button>
</div>

<div id="loading" style="display:none;">Lade Daten...</div>
<div id="error" class="error-box" style="display:none;"></div>

<h2>Aktueller Messwert</h2>
<div id="currentMeasurement" class="card"></div>

<h2>Historie</h2>
<table id="historyTable">
    <thead>
    <tr>
        <th>Station</th><th>Zeitpunkt</th><th>Wasserstand</th><th>Durchfluss</th>
        <th>Niederschlag</th><th>Warnstufe</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="app.js"></script>
</body>
</html>
